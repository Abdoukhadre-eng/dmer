<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DMER – Notifications</title>
<meta name="description" content="DMER – Tableau de bord des notifications de matériels agricoles — conçu et développé par Abdoukhadre Boye">
<meta name="theme-color" content="#1b6e30">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DMER">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  /* Une seule page : écran de démarrage, puis le tableau de bord Apps Script en plein écran. */
  :root{--deep:#14532a;--deep2:#23873a;--sun:#f2b705;--ink:#ffffff;--soft:#d6efd9}
  html,body{margin:0;height:100%;background:var(--deep);color:var(--ink);font-family:system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f5f8f3;opacity:0;transition:opacity .3s}
  #app.on{opacity:1}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:linear-gradient(135deg,var(--deep),var(--deep2));padding:24px;text-align:center;transition:opacity .3s;z-index:2}
  #splash.off{opacity:0;pointer-events:none}
  #splash img{width:110px;height:110px;border-radius:26px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  #splash h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.01em}
  #splash p{margin:0;color:var(--soft);font-size:15px;max-width:320px;line-height:1.45}
  .dots{display:flex;gap:7px}
  .dots i{width:9px;height:9px;border-radius:50%;background:var(--sun);animation:b 1s infinite ease-in-out}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{transform:scale(.5);opacity:.5}40%{transform:scale(1);opacity:1}}
  button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 20px;background:var(--sun);color:#3d2a00;cursor:pointer}
  .foot{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:12.5px;color:var(--soft)}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){.dots i{animation:none}}
</style>
</head>
<body>
<div id="splash" role="status" aria-live="polite">
  <img src="icon-192.png" alt="">
  <h1>DMER</h1>
  <p style="font-size:13.5px;margin-top:-8px">Notifications de matériels agricoles</p>
  <p id="msg">Chargement du tableau de bord…</p>
  <div class="dots" id="dots"><i></i><i></i><i></i></div>
  <button type="button" id="retry" hidden>Réessayer</button>
  <button type="button" id="ouvrir" hidden>Ouvrir le tableau de bord</button>
  <p id="aide" hidden style="font-size:13.5px;max-width:330px">📲 Pour installer l'application : menu <b>⋮</b> du navigateur → <b>Ajouter à l'écran d'accueil</b> → <b>Installer</b>.<br>Sur iPhone : <b>Partager</b> → <b>Sur l'écran d'accueil</b>.</p>
  <div class="foot">Conçu et développé par Abdoukhadre Boye</div>
</div>


<script>
  // ⬇️ SEULE LIGNE À MODIFIER : collez ici le lien /exec de votre déploiement Apps Script
  const LIEN_EXEC = "https://script.google.com/macros/s/AKfycbw63ARmNl0Oz9LMhlC5lctZfiZ69iLgGK1u1tnY2oUrCWpNhcIl_6EI8tejiSCqf6QAig/exec";

  const splash = document.getElementById('splash');
  const msg = document.getElementById('msg'), dots = document.getElementById('dots'), retry = document.getElementById('retry'), ouvrir = document.getElementById('ouvrir'), aide = document.getElementById('aide');

  function erreur(t){ msg.textContent = t; dots.hidden = true; retry.hidden = false; splash.classList.remove('off'); }
  function lancer(){
    if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(LIEN_EXEC)) {
      erreur("Lien de l'application manquant : collez le lien /exec dans index.html (ligne LIEN_EXEC).");
      retry.hidden = true; return;
    }
    if (!navigator.onLine) { erreur("Pas de connexion Internet. Vérifiez vos données mobiles ou le Wi-Fi, puis réessayez."); return; }
    const cible = LIEN_EXEC + (LIEN_EXEC.includes('?') ? '&' : '?') + 'app=1';
    const installee = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;
    if (installee) {
      // Application installée : ouverture directe du tableau de bord
      msg.textContent = 'Ouverture du tableau de bord…'; dots.hidden = false; retry.hidden = true; ouvrir.hidden = true; aide.hidden = true;
      setTimeout(() => location.replace(cible), 400);
      setTimeout(() => erreur("Le chargement prend du temps. Vérifiez votre connexion puis réessayez."), 30000);
    } else {
      // Dans le navigateur : on laisse le temps d'installer l'application
      msg.textContent = 'Tableau de bord de suivi des notifications';
      dots.hidden = true; retry.hidden = true; ouvrir.hidden = false; aide.hidden = false;
      ouvrir.onclick = () => { ouvrir.disabled = true; ouvrir.textContent = 'Ouverture…'; location.href = cible; };
    }
  }
  retry.onclick = lancer;
  window.addEventListener('online', () => { if (!retry.hidden) lancer(); });
  lancer();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
